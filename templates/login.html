<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart City Connect — Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: #fff; border-radius: 16px; padding: 2.5rem; width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
.login-logo-icon { width: 40px; height: 40px; border-radius: 10px; background: #1D9E75; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
.login-title { font-size: 18px; font-weight: 600; }
.login-sub { font-size: 13px; color: #6b7280; }
.form-group { margin-bottom: 1rem; }
label { font-size: 13px; font-weight: 500; color: #374151; display: block; margin-bottom: 6px; }
input { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.15s; }
input:focus { border-color: #1D9E75; }
.btn { width: 100%; padding: 11px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 0.5rem; }
.btn:hover { background: #178a65; }
.error { background: #FAECE7; color: #993C1D; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="login-logo-icon">🏙️</div>
    <div>
      <div class="login-title">Smart City Connect</div>
      <div class="login-sub">Admin Dashboard</div>
    </div>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn">Login</button>
  </form>
</div>
</body>
</html>
